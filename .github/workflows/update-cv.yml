name: Automatically Update CV

on:
  push:
    branches: [main]
    paths:
      - 'cv/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv/main.tex

      - name: Update website PDF
        run: |
          cp cv/main.pdf assets/CV.pdf

      - name: Save updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/CV.pdf
          git diff --cached --quiet || git commit -m "Automatically update CV"
          git push
